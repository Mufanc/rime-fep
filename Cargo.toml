[package]
name = "rime-fep"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
directories = "6"
portable-pty = "0.9"
signal-hook = "0.4"
tempfile = "3"
unicode-width = "0.2"
vt100 = "0.16"
walkdir = "2"

[build-dependencies]
cc = "1"
