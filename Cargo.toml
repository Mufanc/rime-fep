[package]
name = "rime-fep"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", default-features = false }
directories = "6"
flate2 = "1"
portable-pty = "0.9"
signal-hook = "0.4"
unicode-width = "0.2"
vt100 = "0.18.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
flate2 = "1"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = "symbols"
